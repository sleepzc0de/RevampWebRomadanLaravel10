name: CI

on:
  push:
    branches: [main, SUPERFIX_PROD]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, sqlite3, zip, gd
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      # Non-blocking dulu: codebase legacy belum sepenuhnya diformat.
      # Jalankan `vendor/bin/pint` sebagai commit tersendiri, lalu hapus
      # `|| true` di bawah agar style ditegakkan.
      - name: Check code style (Pint)
        run: vendor/bin/pint --test || true

      - name: Static analysis (PHPStan / Larastan)
        run: php -d memory_limit=512M vendor/bin/phpstan analyse --no-progress

      - name: Security audit (non-blocking)
        run: composer audit || true

      - name: Run tests
        run: php artisan test
